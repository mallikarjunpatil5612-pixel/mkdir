{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 480px; margin-top: 3rem; margin-bottom: 4rem;">
    <div style="background: var(--white); padding: 2.2rem; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
        
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <span class="brand-badge">RENTAL TENANT PORTAL</span>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-top: 0.5rem;">Rental Log In</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Sign in to browse houses, save favourites and submit enquiries</p>
        </div>

        <form method="POST">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; border-top: 1px solid var(--border); padding-top: 1rem; color: var(--text-muted);">
            Don't have a rental account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Register as Tenant</a>
        </div>
    </div>
</div>
{% endblock %}
