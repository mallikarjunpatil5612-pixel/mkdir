{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 520px; margin-top: 3rem; margin-bottom: 4rem;">
    <div style="background: var(--white); padding: 2.2rem; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
        
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <span class="brand-badge">TENANT REGISTRATION</span>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-top: 0.5rem;">Rental Register</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Create your tenant account to search and enquire for homes</p>
        </div>

        <form method="POST">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Password (Min. 6 characters)</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Complete Registration</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; border-top: 1px solid var(--border); padding-top: 1rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Sign In here</a>
        </div>
    </div>
</div>
{% endblock %}
